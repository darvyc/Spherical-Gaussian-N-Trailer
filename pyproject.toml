[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spherical-gaussian-ntrailer"
version = "0.1.0"
description = "Learning reverse path following for N-trailer articulated vehicles with spherical tangent features and Gaussian combinatorial encodings."
authors = [{name = "Research Baseline"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.1"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
sga-ntrailer = "sga_ntrailer.cli:main"

[tool.setuptools.packages.find]
include = ["sga_ntrailer*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
